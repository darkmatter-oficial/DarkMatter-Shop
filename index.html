<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set,
get,
runTransaction
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey:"TU_API_KEY",
authDomain:"TU_PROYECTO.firebaseapp.com",
databaseURL:"https://darkmatter-68e65-default-rtdb.firebaseio.com",
projectId:"TU_PROYECTO",
storageBucket:"TU_PROYECTO.appspot.com",
messagingSenderId:"...",
appId:"..."
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const CUTY_API_KEY="0a4fb7e2e5e7b96961905bbc5";

const PAGINA_BASE="https://darkmatter-oficial.github.io/DarkMatter-Shop/";

// Sal usada SOLO para firmar el token (verificar que no fue alterado).
// Ya no se usa para ocultar la IP, porque ahora se guarda en texto plano.
const SAL_FIRMA="dm-2026-cambia-esta-sal-por-una-tuya-larga-y-unica";

const FASES_POR_HORA={ 2:1, 5:2, 8:3 };
const RONDAS_POR_FASE=3;

// Un token de fase (aún no finalizado) deja de ser válido pasado este tiempo,
// así nadie puede guardar un link a mitad del proceso y usarlo días después.
const TOKEN_MAX_EDAD_MS=20*60*1000; // 20 minutos

function generarKey(){

const letras="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
const valoresAleatorios=new Uint32Array(10);
crypto.getRandomValues(valoresAleatorios);

let texto="DM_";
for(let i=0;i<10;i++){
texto+=letras[valoresAleatorios[i]%letras.length];
}
return texto;

}

function formatearFecha(timestamp){

const fecha=new Date(timestamp);
const dias=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const diaSemana=dias[fecha.getDay()];
const dia=String(fecha.getDate()).padStart(2,"0");
const mes=String(fecha.getMonth()+1).padStart(2,"0");
const anio=fecha.getFullYear();
let horas=fecha.getHours();
const minutos=String(fecha.getMinutes()).padStart(2,"0");
const segundos=String(fecha.getSeconds()).padStart(2,"0");
const ampm=horas>=12 ? "PM" : "AM";
horas=horas%12;
horas=horas ? horas : 12;
horas=String(horas).padStart(2,"0");
return `${diaSemana} ${dia}/${mes}/${anio} - ${horas}:${minutos}:${segundos} ${ampm}`;

}

function formatearContador(ms){

if(ms<0) ms=0;
const totalSeg=Math.floor(ms/1000);
const h=String(Math.floor(totalSeg/3600)).padStart(2,"0");
const m=String(Math.floor((totalSeg%3600)/60)).padStart(2,"0");
const s=String(totalSeg%60).padStart(2,"0");
return h+":"+m+":"+s;

}

// --- IP del usuario (se usa tal cual, sin hash ni cifrado) ---

async function obtenerIP(){

try{

const res=await fetch("https://api.ipify.org?format=json");
const data=await res.json();
return data.ip;

}catch(e){

return null;

}

}

async function sha256Hex(texto){

const buffer=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
return Array.from(new Uint8Array(buffer)).map(b=>b.toString(16).padStart(2,"0")).join("");

}

// --- Firma y validez temporal del token de estado ---
// El token sigue firmado para que nadie pueda alterar la fase o la IP que
// lleva dentro, pero ahora transporta la IP en texto plano (no un hash).

async function crearToken(estado){

const payload=JSON.stringify({ ...estado, iat: Date.now() });
const firma=await sha256Hex(payload+SAL_FIRMA);
return btoa(unescape(encodeURIComponent(payload)))+"."+firma;

}

async function leerToken(token){

try{

const [payloadB64, firma]=token.split(".");
const payload=decodeURIComponent(escape(atob(payloadB64)));
const firmaEsperada=await sha256Hex(payload+SAL_FIRMA);

if(firma!==firmaEsperada){
return null;
}

const estado=JSON.parse(payload);

// Los tokens de key ya finalizada (done) no vencen, porque solo muestran
// una key que ya existe. Los tokens de fase intermedia sí vencen rápido.
if(!estado.done){

const edad=Date.now()-estado.iat;

if(edad>TOKEN_MAX_EDAD_MS || edad<0){
return null;
}

}

// Validación estricta de forma: solo duraciones permitidas
if(!FASES_POR_HORA[estado.horas]){
return null;
}

const totalFases=FASES_POR_HORA[estado.horas];
if(!Number.isInteger(estado.fase) || estado.fase<1 || estado.fase>totalFases){
return null;
}

if(typeof estado.key!=="string" || estado.key.length<5){
return null;
}

if(typeof estado.ip!=="string" || estado.ip.length<3){
return null;
}

return estado;

}catch(e){

return null;

}

}

// --- Finaliza la key SOLO cuando se completaron todas las fases y rondas ---
// El nodo KEYS/{key} en Firebase termina con EXACTAMENTE dos campos: ip y
// expira. Nada de hash, nada de flags extra.
//
// Para seguir siendo idempotente (que reabrir el mismo link final no
// vuelva a bloquear ni a pisar la key), la transacción usa como criterio
// "¿ya existe expira guardado?" en vez de un campo finalizado aparte.

async function finalizarKeySiNecesario(key,horas,ip){

const expiraTimestamp=Date.now()+(horas*60*60*1000);
const nodeRef=ref(db,"KEYS/"+key);

const resultado=await runTransaction(nodeRef,(actual)=>{

if(actual && actual.expira){
// Ya estaba finalizada por otro intento/pestaña: no tocar nada
return;
}

return {
ip,
expira: expiraTimestamp
};

});

if(resultado.committed){

// Esta ejecución fue la que finalizó la key de verdad:
// recién aquí se activa el bloqueo por IP.
await guardarBloqueo(ip, expiraTimestamp);
return expiraTimestamp;

}

// Ya estaba finalizada antes: devolvemos su expiración real
const datos=resultado.snapshot.val();
return datos ? datos.expira : expiraTimestamp;

}

// --- Bloqueo por IP (cooldown entre keys, solo tras completar una) ---

async function leerBloqueo(ip){

const snap=await get(ref(db,"IPS/"+ip));
return snap.exists() ? snap.val() : null;

}

async function guardarBloqueo(ip, bloqueadoHasta){

await set(ref(db,"IPS/"+ip), { bloqueadoHasta });

}

const botones=document.getElementById("botones");
const ipInfoDiv=document.getElementById("ipInfo");
const bloqueadoDiv=document.getElementById("bloqueado");
const contadorDiv=document.getElementById("contador");
const faseInfoDiv=document.getElementById("faseInfo");
const faseProgresoDiv=document.getElementById("faseProgreso");
const dotsDiv=document.getElementById("dots");
const btnFase=document.getElementById("btnFase");
const keyDiv=document.getElementById("key");
const expiraDiv=document.getElementById("expira");
const estadoDiv=document.getElementById("estado");
const volverBtn=document.getElementById("volver");
const copiarBtn=document.getElementById("copiar");

let estadoActual=null;
let ipActual=null;
let intervaloContador=null;
let procesando=false;

function ocultarTodo(){

botones.style.display="none";
bloqueadoDiv.style.display="none";
faseInfoDiv.style.display="none";
keyDiv.style.display="none";
expiraDiv.style.display="none";
volverBtn.style.display="none";
copiarBtn.style.display="none";
estadoDiv.innerText="";
estadoDiv.classList.remove("error");

if(intervaloContador){
clearInterval(intervaloContador);
intervaloContador=null;
}

}

function mostrarError(msg){

ocultarTodo();
botones.style.display="flex";
estadoDiv.innerText=msg;
estadoDiv.classList.add("error");

}

function mostrarBotones(){

ocultarTodo();
botones.style.display="flex";

}

function mostrarBloqueado(bloqueadoHasta){

ocultarTodo();
bloqueadoDiv.style.display="block";

function actualizar(){

const restante=bloqueadoHasta-Date.now();

if(restante<=0){

clearInterval(intervaloContador);
intervaloContador=null;
mostrarBotones();
return;

}

contadorDiv.innerText=formatearContador(restante);

}

actualizar();
intervaloContador=setInterval(actualizar,1000);

}

function pintarDotsFases(faseActual,total){

dotsDiv.innerHTML="";
for(let i=1;i<=total;i++){
const d=document.createElement("div");
d.className="dot"+(i<=faseActual ? " activo" : "");
dotsDiv.appendChild(d);
}

}

function mostrarPantallaFase(fase,total){

ocultarTodo();
faseInfoDiv.style.display="block";
volverBtn.style.display="inline-block";

faseProgresoDiv.innerText="Fase "+fase+" de "+total;
pintarDotsFases(fase,total);

btnFase.disabled=false;
btnFase.innerText="INICIAR FASE "+fase;

}

function mostrarKey(key, expiraTimestamp){

ocultarTodo();
keyDiv.style.display="block";
expiraDiv.style.display="block";
volverBtn.style.display="inline-block";
copiarBtn.style.display="inline-block";

keyDiv.innerText=key;
expiraDiv.innerHTML="Expira el:<br><b>"+formatearFecha(expiraTimestamp)+"</b>";
estadoDiv.innerText="✔ Key lista para usar";

}

async function reiniciar(){

const url=new URL(window.location.href);
url.search="";
window.history.replaceState({}, "", url.toString());

estadoActual=null;
document.querySelectorAll(".botones .btn").forEach(b=>{
b.disabled=false;
b.innerHTML="⏱ KEY "+b.dataset.horas+" HORAS";
});
keyDiv.innerText="";
expiraDiv.innerHTML="";

await revisarEstadoInicial();

}

volverBtn.addEventListener("click", reiniciar);

copiarBtn.addEventListener("click", ()=>{

navigator.clipboard.writeText(keyDiv.innerText);
estadoDiv.innerText="✔ Key copiada al portapapeles";

});

async function acortarConCuty(urlLarga){

const apiUrl="https://cuty.io/api?api="+CUTY_API_KEY+"&url="+encodeURIComponent(urlLarga)+"&format=text";

const respuesta=await fetch(apiUrl);

if(!respuesta.ok){
throw new Error("cuty.io respondió con error "+respuesta.status);
}

const texto=(await respuesta.text()).trim();

if(!texto || !texto.startsWith("http")){
throw new Error("cuty.io devolvió una respuesta inválida");
}

return texto;

}

async function construirCadenaCuty(numRondas, urlFinal){

let urlActual=urlFinal;

for(let i=0;i<numRondas;i++){
urlActual=await acortarConCuty(urlActual);
}

return urlActual;

}

async function irACutyFase(estadoBase, faseSiguiente, total, done){

const nuevoEstado={ ...estadoBase, fase: done ? estadoBase.fase : faseSiguiente, done: !!done };

const token=await crearToken(nuevoEstado);
const urlDestinoFinal=PAGINA_BASE+"?t="+encodeURIComponent(token);

const primerLink=await construirCadenaCuty(RONDAS_POR_FASE, urlDestinoFinal);

window.location.href=primerLink;

}

document.querySelectorAll(".botones .btn").forEach(btn=>{

btn.addEventListener("click", async ()=>{

if(procesando) return;

if(!ipActual){
estadoDiv.innerText="✘ No se pudo verificar tu conexión, recarga la página";
estadoDiv.classList.add("error");
return;
}

// Doble chequeo defensivo: revalida el bloqueo justo antes de generar
const bloqueo=await leerBloqueo(ipActual);

if(bloqueo && bloqueo.bloqueadoHasta>Date.now()){

mostrarBloqueado(bloqueo.bloqueadoHasta);
return;

}

procesando=true;

const horas=parseInt(btn.dataset.horas);
const total=FASES_POR_HORA[horas];

document.querySelectorAll(".botones .btn").forEach(b=> b.disabled=true );
btn.innerHTML="<span class='spinner'></span> Preparando...";

try{

const key=generarKey();

// No se escribe nada en Firebase todavía. La key solo existe en
// memoria y dentro del token firmado hasta que se completen las fases.
estadoActual={ key, horas, ip: ipActual, fase:1, done:false };

const url=new URL(window.location.href);
url.search="";
const token=await crearToken(estadoActual);
url.searchParams.set("t", token);
window.history.replaceState({}, "", url.toString());

mostrarPantallaFase(1,total);

}catch(e){

btn.innerHTML="⏱ KEY "+btn.dataset.horas+" HORAS";
document.querySelectorAll(".botones .btn").forEach(b=> b.disabled=false );
estadoDiv.innerText="✘ Error al generar la key";
estadoDiv.classList.add("error");

}finally{

procesando=false;

}

});

});

btnFase.addEventListener("click", async ()=>{

if(procesando) return;

if(!estadoActual){
mostrarError("Sesión inválida, genera una key de nuevo.");
return;
}

procesando=true;

const total=FASES_POR_HORA[estadoActual.horas];
const esUltimaFase=estadoActual.fase>=total;

btnFase.disabled=true;
btnFase.innerHTML="<span class='spinner'></span> Redirigiendo...";

try{

if(esUltimaFase){

await irACutyFase(estadoActual, estadoActual.fase, total, true);

}else{

await irACutyFase(estadoActual, estadoActual.fase+1, total, false);

}

}catch(e){

btnFase.disabled=false;
btnFase.innerText="INICIAR FASE "+estadoActual.fase;
estadoDiv.innerText="✘ Error al continuar, inténtalo de nuevo";
estadoDiv.classList.add("error");

}finally{

procesando=false;

}

});

async function revisarEstadoInicial(){

const params=new URLSearchParams(window.location.search);
const token=params.get("t");

if(token){

const estado=await leerToken(token);

if(!estado){
mostrarError("Enlace inválido, alterado o vencido. Genera una key nuevamente.");
return;
}

// La IP dentro del token debe coincidir con la de esta sesión
if(estado.ip!==ipActual){
mostrarError("Este enlace fue generado desde otra conexión y no es válido aquí.");
return;
}

estadoActual=estado;
const total=FASES_POR_HORA[estado.horas];

if(estado.done){

// Recién aquí se escribe en Firebase: ip + expira, y se activa
// el bloqueo. Es la única escritura de todo el flujo.
const expiraTimestamp=await finalizarKeySiNecesario(estado.key, estado.horas, ipActual);
mostrarKey(estado.key, expiraTimestamp);

}else{

mostrarPantallaFase(estado.fase, total);

}

return;

}

const bloqueo=await leerBloqueo(ipActual);

if(bloqueo && bloqueo.bloqueadoHasta>Date.now()){

mostrarBloqueado(bloqueo.bloqueadoHasta);

}else{

mostrarBotones();

}

}

window.addEventListener("DOMContentLoaded", async ()=>{

ipActual=await obtenerIP();

if(!ipActual){

ipInfoDiv.innerText="⚠ No se pudo verificar tu IP";
mostrarError("No se pudo verificar tu conexión. Recarga la página e inténtalo de nuevo.");
return;

}

ipInfoDiv.innerText="Conexión verificada";

await revisarEstadoInicial();

});

</script>
