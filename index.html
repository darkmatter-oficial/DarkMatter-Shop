<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DarkMatter Key Generator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top, #1e0530, #0a0010 70%);
    font-family:'Segoe UI', Arial, sans-serif;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:linear-gradient(160deg,#22093a,#170428);
    border:1px solid #a855f7;
    border-radius:24px;
    padding:40px 32px;
    text-align:center;
    color:white;
    box-shadow:0 0 60px rgba(139,92,246,0.35), inset 0 0 30px rgba(168,85,247,0.05);
    animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    color:#d8b4fe;
    letter-spacing:5px;
    font-size:32px;
    margin:0 0 8px 0;
    text-shadow:0 0 20px #a855f7;
}

.subtitulo{
    color:#8b5cf6;
    font-size:15px;
    margin-bottom:32px;
    letter-spacing:1px;
}

.botones{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.btn{
    background:#2b0a47;
    border:1px solid #7c3aed;
    color:#e9d5ff;
    padding:18px;
    border-radius:14px;
    font-size:17px;
    font-weight:600;
    letter-spacing:1px;
    cursor:pointer;
    transition:all 0.25s ease;
}

.btn:hover{
    background:#a855f7;
    color:#170428;
    box-shadow:0 0 20px #a855f7;
    transform:translateY(-2px);
}

.btn:active{
    transform:translateY(0);
}

.btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
    transform:none;
}

.fase-info{
    background:#170428;
    border:1px solid #7c3aed;
    border-radius:16px;
    padding:24px 18px;
    margin-top:6px;
    display:none;
}

.fase-titulo{
    color:#c084fc;
    font-size:15px;
    letter-spacing:1px;
    margin-bottom:4px;
}

.fase-progreso{
    color:#facc15;
    font-size:22px;
    font-weight:bold;
    margin-bottom:18px;
}

.dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#3b0764;
    border:1px solid #7c3aed;
}

.dot.activo{
    background:#a855f7;
    box-shadow:0 0 10px #a855f7;
}

.key{
    background:#170428;
    border:1px solid #7c3aed;
    border-radius:16px;
    padding:22px;
    margin-top:26px;
    font-size:24px;
    font-weight:bold;
    color:#d8b4fe;
    letter-spacing:1px;
    display:none;
    word-break:break-all;
    box-shadow:inset 0 0 15px rgba(168,85,247,0.2);
}

.expira{
    margin-top:16px;
    color:#facc15;
    font-size:15px;
    display:none;
    line-height:1.6;
}

.expira b{
    color:#fde047;
}

.estado{
    margin-top:18px;
    font-size:15px;
    font-weight:600;
    color:#7ee787;
    min-height:20px;
}

.btn-volver{
    margin-top:26px;
    background:none;
    border:none;
    color:#a855f7;
    font-size:14px;
    text-decoration:underline;
    cursor:pointer;
    display:none;
}

.btn-volver:hover{
    color:#d8b4fe;
}

.btn-copiar{
    margin-top:16px;
    background:#3b0764;
    border:1px solid #a855f7;
    color:#e9d5ff;
    padding:10px 18px;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    display:none;
}

.btn-copiar:hover{
    background:#a855f7;
    color:#170428;
}

.spinner{
    display:inline-block;
    width:16px;
    height:16px;
    border:2px solid #a855f7;
    border-top:2px solid transparent;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    margin-right:8px;
    vertical-align:middle;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}
</style>
</head>
<body>

<div class="card">
<h1>DARKMATTER</h1>
<div class="subtitulo">GENERADOR DE KEYS</div>

<div class="botones" id="botones">
<button class="btn" data-horas="2">KEY 2 HORAS</button>
<button class="btn" data-horas="5">KEY 5 HORAS</button>
<button class="btn" data-horas="8">KEY 8 HORAS</button>
</div>

<div class="fase-info" id="faseInfo">
<div class="fase-titulo" id="faseTitulo">FASE PENDIENTE</div>
<div class="fase-progreso" id="faseProgreso">Fase 1 de 3</div>
<div class="dots" id="dots"></div>
<button class="btn" id="btnFase">INICIAR FASE</button>
</div>

<div class="key" id="key"></div>

<div class="expira" id="expira"></div>

<div class="estado" id="estado"></div>

<button class="btn-copiar" id="copiar">📋 Copiar key</button>

<button class="btn-volver" id="volver">← Generar otra key</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey:"TU_API_KEY",
authDomain:"TU_PROYECTO.firebaseapp.com",
databaseURL:"https://darkmatter-68e65-default-rtdb.firebaseio.com",
projectId:"TU_PROYECTO",
storageBucket:"TU_PROYECTO.appspot.com",
messagingSenderId:"...",
appId:"..."
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

// ⚠️ Pega aquí tu API KEY de cuty.io (la encuentras en tu panel de cuty.io)
const CUTY_API_KEY="TU_API_KEY_DE_CUTY";

const PAGINA_BASE="https://darkmatter-oficial.github.io/DarkMatter-Shop/";

// Cuántas fases de anuncios requiere cada duración
const FASES_POR_HORA={
2:1,
5:2,
8:3
};

function generarKey(){

const letras="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let texto="DM_";

for(let i=0;i<10;i++){

texto+=letras[Math.floor(Math.random()*letras.length)];

}

return texto;

}

function formatearFecha(fecha){

const dias=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const diaSemana=dias[fecha.getDay()];

const dia=String(fecha.getDate()).padStart(2,"0");
const mes=String(fecha.getMonth()+1).padStart(2,"0");
const anio=fecha.getFullYear();

let horas=fecha.getHours();
const minutos=String(fecha.getMinutes()).padStart(2,"0");
const segundos=String(fecha.getSeconds()).padStart(2,"0");
const ampm=horas>=12 ? "PM" : "AM";

horas=horas%12;
horas=horas ? horas : 12;
horas=String(horas).padStart(2,"0");

return `${diaSemana} ${dia}/${mes}/${anio} - ${horas}:${minutos}:${segundos} ${ampm}`;

}

const botones=document.getElementById("botones");
const faseInfoDiv=document.getElementById("faseInfo");
const faseTituloDiv=document.getElementById("faseTitulo");
const faseProgresoDiv=document.getElementById("faseProgreso");
const dotsDiv=document.getElementById("dots");
const btnFase=document.getElementById("btnFase");
const keyDiv=document.getElementById("key");
const expiraDiv=document.getElementById("expira");
const estadoDiv=document.getElementById("estado");
const volverBtn=document.getElementById("volver");
const copiarBtn=document.getElementById("copiar");

function ocultarTodo(){

botones.style.display="none";
faseInfoDiv.style.display="none";
keyDiv.style.display="none";
expiraDiv.style.display="none";
volverBtn.style.display="none";
copiarBtn.style.display="none";
estadoDiv.innerText="";

}

function pintarDots(faseActual,total){

dotsDiv.innerHTML="";

for(let i=1;i<=total;i++){

const d=document.createElement("div");
d.className="dot"+(i<=faseActual ? " activo" : "");
dotsDiv.appendChild(d);

}

}

function mostrarPantallaFase(faseSiguiente,total){

ocultarTodo();

faseInfoDiv.style.display="block";
volverBtn.style.display="inline-block";

faseTituloDiv.innerText="DEBES COMPLETAR TODAS LAS FASES";
faseProgresoDiv.innerText="Fase "+faseSiguiente+" de "+total;
pintarDots(faseSiguiente-1,total);

btnFase.disabled=false;
btnFase.innerText="INICIAR FASE "+faseSiguiente;

}

function mostrarKey(key, expiraTexto){

ocultarTodo();

keyDiv.style.display="block";
expiraDiv.style.display="block";
volverBtn.style.display="inline-block";
copiarBtn.style.display="inline-block";

keyDiv.innerText=key;
expiraDiv.innerHTML="Expira el:<br><b>"+expiraTexto+"</b>";
estadoDiv.innerText="✔ Key lista para usar";

}

function reiniciar(){

const url=new URL(window.location.href);
url.search="";
window.history.replaceState({}, "", url.toString());

ocultarTodo();
botones.style.display="flex";
keyDiv.innerText="";
expiraDiv.innerHTML="";

}

volverBtn.addEventListener("click", reiniciar);

copiarBtn.addEventListener("click", ()=>{

navigator.clipboard.writeText(keyDiv.innerText);
estadoDiv.innerText="✔ Key copiada al portapapeles";

});

async function acortarConCuty(urlLarga){

const apiUrl="https://cuty.io/api?api="+CUTY_API_KEY+"&url="+encodeURIComponent(urlLarga)+"&format=text";

const respuesta=await fetch(apiUrl);
const texto=await respuesta.text();

return texto.trim();

}

async function irAFase(key,horas,expiraTexto,fase,total){

const urlRetorno=PAGINA_BASE
+"?key="+encodeURIComponent(key)
+"&horas="+horas
+"&expira="+encodeURIComponent(expiraTexto)
+"&fase="+fase
+"&total="+total;

const enlaceCorto=await acortarConCuty(urlRetorno);

window.location.href=enlaceCorto;

}

// Botones iniciales para elegir duración
document.querySelectorAll(".botones .btn").forEach(btn=>{

btn.addEventListener("click", async ()=>{

const horas=parseInt(btn.dataset.horas);
const total=FASES_POR_HORA[horas];

document.querySelectorAll(".botones .btn").forEach(b=> b.disabled=true );
btn.innerHTML="<span class='spinner'></span> Generando...";

const key=generarKey();

const ahora=new Date();
const fechaExpira=new Date(ahora.getTime() + (horas*60*60*1000));

const expiraTexto=formatearFecha(fechaExpira);
const expiraTimestamp=fechaExpira.getTime();

try{

await set(ref(db,"KEYS/"+key),{
duracionHoras:horas,
expira:expiraTexto,
expiraTimestamp:expiraTimestamp
});

await irAFase(key,horas,expiraTexto,1,total);

}catch(e){

btn.innerHTML=btn.dataset.horas+" HORAS";
document.querySelectorAll(".botones .btn").forEach(b=> b.disabled=false );
estadoDiv.innerText="✘ Error al generar la key";

}

});

});

// Botón para avanzar a la siguiente fase
btnFase.addEventListener("click", async ()=>{

const params=new URLSearchParams(window.location.search);
const key=params.get("key");
const horas=params.get("horas");
const expira=params.get("expira");
const fase=parseInt(params.get("fase"));
const total=parseInt(params.get("total"));

btnFase.disabled=true;
btnFase.innerHTML="<span class='spinner'></span> Redirigiendo...";

try{

await irAFase(key,horas,decodeURIComponent(expira),fase+1,total);

}catch(e){

btnFase.disabled=false;
btnFase.innerText="INICIAR FASE "+(fase+1);
estadoDiv.innerText="✘ Error al continuar, inténtalo de nuevo";

}

});

// Al cargar la página, revisamos en qué punto del flujo estamos
window.addEventListener("DOMContentLoaded", ()=>{

const params=new URLSearchParams(window.location.search);
const key=params.get("key");
const horas=params.get("horas");
const expira=params.get("expira");
const fase=parseInt(params.get("fase"));
const total=parseInt(params.get("total"));

if(key && horas && expira && fase && total){

if(fase<total){

mostrarPantallaFase(fase+1, total);

}else{

mostrarKey(key, decodeURIComponent(expira));

}

}

});

</script>

</body>
</html>
