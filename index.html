<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Key Sistem</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(circle at 20% 20%, #2d0a4e, #0a0512 70%);
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  body::before, body::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 0;
  }
  body::before { background: #7b2ff7; top: -100px; left: -100px; opacity: 0.4; }
  body::after { background: #b721ff; bottom: -120px; right: -100px; opacity: 0.35; }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(30, 10, 50, 0.55);
    border: 1px solid rgba(183, 33, 255, 0.35);
    border-radius: 20px;
    padding: 36px 30px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 60px rgba(183, 33, 255, 0.25);
  }
  h1 {
    font-size: 22px;
    background: linear-gradient(90deg, #b721ff, #7b2ff7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  p.sub { color: #c8b8e0; font-size: 14px; margin-bottom: 22px; }
  .key-box {
    background: rgba(0,0,0,0.35);
    border: 1px dashed #b721ff;
    border-radius: 12px;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    word-break: break-all;
    margin-bottom: 16px;
    display: none;
    box-shadow: 0 0 20px rgba(183,33,255,0.2) inset;
  }
  button, a.btn2 {
    display: block;
    background: linear-gradient(90deg, #7b2ff7, #b721ff);
    color: #fff;
    border: none;
    text-decoration: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 0 20px rgba(183, 33, 255, 0.4);
    margin-top: 8px;
  }
  button:disabled { background: #3a2d4a; box-shadow: none; cursor: not-allowed; }
  .status { font-size: 13px; color: #c8b8e0; margin-top: 14px; min-height: 18px; }
  .loader {
    border: 3px solid rgba(183,33,255,0.2);
    border-top: 3px solid #b721ff;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 0.8s linear infinite;
    margin: 20px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { margin-top: 20px; font-size: 11px; color: #6a5a85; }
</style>
</head>
<body>

<div class="card">
  <h1>🔮 DM Key Sistem</h1>
  <p class="sub" id="subText">Verificando acceso...</p>

  <div id="loader" class="loader"></div>
  <div id="keyBox" class="key-box"></div>
  <button id="copyBtn" style="display:none;" onclick="copiarKey()">Copiar key</button>
  <a id="backBtn" class="btn2" style="display:none;" href="https://darkmatter-oficial.github.io/DarkMatter-Shop/">Volver a generar</a>

  <div id="status" class="status"></div>
  <div class="footer">DarkMatter © 2026</div>
</div>

<script>
  // ⚠️ Reemplazá con la config real de tu proyecto Firebase
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    databaseURL: "https://TU_PROYECTO.firebaseio.com",
    projectId: "TU_PROYECTO"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const DURACION_HORAS = 24;
  const COOLDOWN_HORAS = 24;
  const REFERRER_VALIDO = "blacklink.site";

  function generarKey() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let random = "";
    for (let i = 0; i < 8; i++) random += chars.charAt(Math.floor(Math.random() * chars.length));
    return "FREE-" + random;
  }

  async function obtenerIP() {
    const res = await fetch("https://api.ipify.org?format=json");
    const data = await res.json();
    return data.ip.replace(/\./g, "_");
  }

  async function iniciar() {
    const status = document.getElementById("status");
    const sub = document.getElementById("subText");
    const loader = document.getElementById("loader");
    const backBtn = document.getElementById("backBtn");

    // 1. Verificar que venga de BlackLink
    if (!document.referrer.includes(REFERRER_VALIDO)) {
      loader.style.display = "none";
      sub.textContent = "Acceso no válido.";
      status.textContent = "Tenés que completar el acortador primero.";
      backBtn.style.display = "block";
      return;
    }

    try {
      const ip = await obtenerIP();
      const cooldownRef = db.ref("COOLDOWNS/" + ip);
      const snap = await cooldownRef.once("value");
      const ahora = Date.now();

      if (snap.exists()) {
        const ultima = snap.val().timestamp;
        const restante = (ultima + COOLDOWN_HORAS * 3600 * 1000) - ahora;
        if (restante > 0) {
          loader.style.display = "none";
          const horas = Math.ceil(restante / 3600000);
          sub.textContent = "Ya generaste una key.";
          status.textContent = `Volvé a intentar en ~${horas}h.`;
          backBtn.style.display = "block";
          return;
        }
      }

      let key, existe = true;
      while (existe) {
        key = generarKey();
        const check = await db.ref("KEYS/" + key).once("value");
        existe = check.exists();
      }

      const expira = ahora + DURACION_HORAS * 3600 * 1000;
      await db.ref("KEYS/" + key).set({ expira: expira });
      await cooldownRef.set({ timestamp: ahora });

      loader.style.display = "none";
      sub.textContent = "¡Key generada con éxito!";
      const box = document.getElementById("keyBox");
      box.textContent = key;
      box.style.display = "block";
      document.getElementById("copyBtn").style.display = "block";
      status.textContent = `Válida por ${DURACION_HORAS} horas.`;

    } catch (err) {
      loader.style.display = "none";
      status.textContent = "Error al generar la key. Intentá de nuevo.";
      backBtn.style.display = "block";
      console.error(err);
    }
  }

  function copiarKey() {
    const key = document.getElementById("keyBox").textContent;
    navigator.clipboard.writeText(key);
    document.getElementById("status").textContent = "¡Copiada!";
  }

  iniciar();
</script>

</body>
</html>
