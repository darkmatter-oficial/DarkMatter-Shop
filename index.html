<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DarkMatter Key Generator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at top, #1e0530, #0a0010 70%);
    font-family:'Segoe UI', Arial, sans-serif;
}

.card{
    width:380px;
    background:linear-gradient(160deg,#22093a,#170428);
    border:1px solid #a855f7;
    border-radius:24px;
    padding:36px 30px;
    text-align:center;
    color:white;
    box-shadow:0 0 60px rgba(139,92,246,0.35), inset 0 0 30px rgba(168,85,247,0.05);
    animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    color:#d8b4fe;
    letter-spacing:4px;
    font-size:26px;
    margin:0 0 6px 0;
    text-shadow:0 0 20px #a855f7;
}

.subtitulo{
    color:#8b5cf6;
    font-size:13px;
    margin-bottom:26px;
    letter-spacing:1px;
}

.botones{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.btn{
    background:#2b0a47;
    border:1px solid #7c3aed;
    color:#e9d5ff;
    padding:14px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    letter-spacing:1px;
    cursor:pointer;
    transition:all 0.25s ease;
}

.btn:hover{
    background:#a855f7;
    color:#170428;
    box-shadow:0 0 20px #a855f7;
    transform:translateY(-2px);
}

.btn:active{
    transform:translateY(0);
}

.key{
    background:#170428;
    border:1px solid #7c3aed;
    border-radius:14px;
    padding:18px;
    margin-top:22px;
    font-size:20px;
    font-weight:bold;
    color:#d8b4fe;
    letter-spacing:1px;
    display:none;
    word-break:break-all;
    box-shadow:inset 0 0 15px rgba(168,85,247,0.2);
}

.expira{
    margin-top:14px;
    color:#facc15;
    font-size:13px;
    display:none;
    line-height:1.5;
}

.expira b{
    color:#fde047;
}

.estado{
    margin-top:16px;
    font-size:14px;
    font-weight:600;
    color:#7ee787;
    min-height:18px;
}

.btn-volver{
    margin-top:22px;
    background:none;
    border:none;
    color:#a855f7;
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    display:none;
}

.btn-volver:hover{
    color:#d8b4fe;
}

.spinner{
    display:inline-block;
    width:14px;
    height:14px;
    border:2px solid #a855f7;
    border-top:2px solid transparent;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    margin-right:8px;
    vertical-align:middle;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}
</style>
</head>
<body>

<div class="card">
<h1>DARKMATTER</h1>
<div class="subtitulo">GENERADOR DE KEYS</div>

<div class="botones" id="botones">
<button class="btn" data-horas="2">KEY 2 HORAS</button>
<button class="btn" data-horas="5">KEY 5 HORAS</button>
<button class="btn" data-horas="8">KEY 8 HORAS</button>
</div>

<div class="key" id="key"></div>

<div class="expira" id="expira"></div>

<div class="estado" id="estado"></div>

<button class="btn-volver" id="volver">← Generar otra key</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey:"TU_API_KEY",
authDomain:"TU_PROYECTO.firebaseapp.com",
databaseURL:"https://darkmatter-68e65-default-rtdb.firebaseio.com",
projectId:"TU_PROYECTO",
storageBucket:"TU_PROYECTO.appspot.com",
messagingSenderId:"...",
appId:"..."
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

function generarKey(){

const letras="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let texto="DM_";

for(let i=0;i<10;i++){

texto+=letras[Math.floor(Math.random()*letras.length)];

}

return texto;

}

function formatearFecha(fecha){

const dias=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const diaSemana=dias[fecha.getDay()];

const dia=String(fecha.getDate()).padStart(2,"0");
const mes=String(fecha.getMonth()+1).padStart(2,"0");
const anio=fecha.getFullYear();

let horas=fecha.getHours();
const minutos=String(fecha.getMinutes()).padStart(2,"0");
const segundos=String(fecha.getSeconds()).padStart(2,"0");
const ampm=horas>=12 ? "PM" : "AM";

horas=horas%12;
horas=horas ? horas : 12;
horas=String(horas).padStart(2,"0");

return `${diaSemana} ${dia}/${mes}/${anio} - ${horas}:${minutos}:${segundos} ${ampm}`;

}

const botones=document.getElementById("botones");
const keyDiv=document.getElementById("key");
const expiraDiv=document.getElementById("expira");
const estadoDiv=document.getElementById("estado");
const volverBtn=document.getElementById("volver");

function reiniciar(){

botones.style.display="flex";
keyDiv.style.display="none";
expiraDiv.style.display="none";
volverBtn.style.display="none";
estadoDiv.innerText="";
keyDiv.innerText="";
expiraDiv.innerHTML="";

}

volverBtn.addEventListener("click", reiniciar);

document.querySelectorAll(".btn").forEach(btn=>{

btn.addEventListener("click", async ()=>{

const horas=parseInt(btn.dataset.horas);

botones.style.display="none";

keyDiv.style.display="block";
expiraDiv.style.display="block";

keyDiv.innerHTML="<span class='spinner'></span> Generando...";
estadoDiv.innerText="Conectando...";

const key=generarKey();

const ahora=new Date();

const expiraTexto=formatearFecha(fechaExpira);
const expiraTimestamp=fechaExpira.getTime();

keyDiv.innerText=key;
expiraDiv.innerHTML="Expira el:<br><b>"+expiraTexto+"</b>";

try{

await set(ref(db,"KEYS/"+key),{
duracionHoras:horas,
expira:expiraTexto,
expiraTimestamp:expiraTimestamp
});

estadoDiv.innerText="✔ Key agregada";
volverBtn.style.display="inline-block";

}catch(e){

estadoDiv.innerText="✘ Error al guardar";
volverBtn.style.display="inline-block";

}

});

});

</script>

</body>
</html>
