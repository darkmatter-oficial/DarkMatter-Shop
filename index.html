<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Key Sistem</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Segoe UI', sans-serif;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(circle at 20% 20%, #2d0a4e, #0a0512 70%);
    color: #fff;
    position: relative;
  }
  body::before, body::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 0;
  }
  body::before { background: #7b2ff7; top: -100px; left: -100px; opacity: 0.4; }
  body::after { background: #b721ff; bottom: -120px; right: -100px; opacity: 0.35; }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(30, 10, 50, 0.55);
    border: 1px solid rgba(183, 33, 255, 0.35);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 400px;
    width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    text-align: center;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 60px rgba(183, 33, 255, 0.25);
  }
  h1 {
    font-size: 21px;
    background: linear-gradient(90deg, #b721ff, #7b2ff7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  h2 {
    font-size: 16px;
    color: #fff;
    margin-bottom: 14px;
  }
  p.sub { color: #c8b8e0; font-size: 14px; margin-bottom: 20px; }
  .key-box {
    background: rgba(0,0,0,0.35);
    border: 1px dashed #b721ff;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    word-break: break-all;
    margin-bottom: 14px;
    display: none;
    box-shadow: 0 0 20px rgba(183,33,255,0.2) inset;
  }
  .timer-box {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(183, 33, 255, 0.3);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    display: none;
  }
  .timer-box .label { font-size: 12px; color: #a894c4; margin-bottom: 6px; }
  .timer-box .clock {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #b721ff, #7b2ff7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  button, a.btn2 {
    display: block;
    background: linear-gradient(90deg, #7b2ff7, #b721ff);
    color: #fff;
    border: none;
    text-decoration: none;
    padding: 13px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 0 20px rgba(183, 33, 255, 0.4);
    margin-top: 8px;
  }
  button:disabled { background: #3a2d4a; box-shadow: none; cursor: not-allowed; }
  .status { font-size: 13px; color: #c8b8e0; margin-top: 12px; min-height: 18px; }
  .debug { font-size: 10px; color: #6a5a85; margin-top: 8px; word-break: break-all; }
  .loader {
    border: 3px solid rgba(183,33,255,0.2);
    border-top: 3px solid #b721ff;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    animation: spin 0.8s linear infinite;
    margin: 18px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { margin-top: 16px; font-size: 11px; color: #6a5a85; }
</style>
</head>
<body>

<div class="card">

  <!-- ===================== PANTALLA PRINCIPAL ===================== -->
  <div id="mainScreen">
    <h1>🔮 DM Key Sistem</h1>
    <p class="sub" id="subText">Verificando acceso...</p>

    <div id="loader" class="loader"></div>

    <div id="timerBox" class="timer-box">
      <div class="label" id="timerLabel">Tu key es válida por:</div>
      <div id="clock" class="clock">00:00:00</div>
    </div>

    <div id="keyBox" class="key-box"></div>
    <button id="copyBtn" style="display:none;" onclick="copiarKey()">Copiar key</button>
    <a id="goShortenerBtn" class="btn2" style="display:none;" href="https://blacklink.site/l.php?u=u94d980f76e">⚡ Generar Key de 8h</a>
    <a id="backBtn" class="btn2" style="display:none;" href="https://darkmatter-oficial.github.io/DarkMatter-Shop/">Volver</a>

    <div id="status" class="status"></div>
    <div id="debug" class="debug"></div>
    <div class="footer">DarkMatter © 2026</div>
  </div>

</div>

<script>
  // ===================== NOTA DE SEGURIDAD IMPORTANTE =====================
  // Este sistema es 100% cliente (HTML/JS) y llama directamente a la REST API
  // de Firebase. Si el nodo /KEYS o /COOLDOWNS de tu Realtime Database permite
  // lectura/escritura pública sin reglas, cualquier persona puede crear/borrar
  // keys directamente contra la API de Firebase, sin pasar por esta página.
  // Configurá las Firebase Security Rules (por ejemplo, exigiendo autenticación
  // de Firebase Auth o validando la forma de los datos) desde la consola de
  // Firebase para cerrar ese hueco.
  const DB_URL = "https://darkmatter-68e65-default-rtdb.firebaseio.com";

  const DURACION_HORAS = 8;
  const COOLDOWN_HORAS = 8;
  const REFERRER_VALIDO = "blacklink.site";

  function generarKey() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    function rand(n) {
      let s = "";
      for (let i = 0; i < n; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
      return s;
    }
    return `ADS-${rand(4)}DM${rand(4)}`;
  }

  async function obtenerIP() {
    const res = await fetch("https://api.ipify.org?format=json");
    if (!res.ok) throw new Error("No se pudo obtener la IP");
    const data = await res.json();
    return data.ip.replace(/\./g, "_");
  }

  async function dbGet(path) {
    const res = await fetch(`${DB_URL}/${path}.json`);
    const data = await res.json();
    if (!res.ok || (data && data.error)) {
      throw new Error("Firebase: " + (data && data.error ? data.error : res.status));
    }
    return data;
  }
  async function dbSet(path, value) {
    const res = await fetch(`${DB_URL}/${path}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(value)
    });
    const data = await res.json();
    if (!res.ok || (data && data.error)) {
      throw new Error("Firebase: " + (data && data.error ? data.error : res.status));
    }
    return data;
  }

  function iniciarContador(msRestante, etiqueta) {
    const timerBox = document.getElementById("timerBox");
    const clock = document.getElementById("clock");
    const timerLabel = document.getElementById("timerLabel");
    const backBtn = document.getElementById("backBtn");
    timerBox.style.display = "block";
    backBtn.style.display = "block";
    if (etiqueta) timerLabel.textContent = etiqueta;

    let restante = msRestante;
    function tick() {
      if (restante <= 0) {
        clock.textContent = "00:00:00";
        document.getElementById("status").textContent = "¡Ya podés generar otra key!";
        return;
      }
      const h = Math.floor(restante / 3600000);
      const m = Math.floor((restante % 3600000) / 60000);
      const s = Math.floor((restante % 60000) / 1000);
      clock.textContent = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      restante -= 1000;
      setTimeout(tick, 1000);
    }
    tick();
  }

  async function iniciar() {
    const status = document.getElementById("status");
    const sub = document.getElementById("subText");
    const loader = document.getElementById("loader");
    const backBtn = document.getElementById("backBtn");
    const goShortenerBtn = document.getElementById("goShortenerBtn");
    const debug = document.getElementById("debug");

    let ip, ahora, cooldown;

    // Primero se revisa si ya existe una key gratis activa para esta IP,
    // sin importar si se entró directo o a través del acortador.
    try {
      ip = await obtenerIP();
      ahora = Date.now();
      cooldown = await dbGet(`COOLDOWNS/${ip}`);
    } catch (err) {
      loader.style.display = "none";
      sub.textContent = "Ocurrió un error.";
      status.textContent = "Tocá para reintentar.";
      debug.textContent = err.message;
      backBtn.style.display = "block";
      console.error(err);
      return;
    }

    if (cooldown && cooldown.timestamp && cooldown.key) {
      const restante = (cooldown.timestamp + COOLDOWN_HORAS * 3600 * 1000) - ahora;
      if (restante > 0) {
        loader.style.display = "none";
        sub.textContent = "Ya tenés una key activa.";
        const box = document.getElementById("keyBox");
        box.textContent = cooldown.key;
        box.style.display = "block";
        document.getElementById("copyBtn").style.display = "block";
        status.textContent = `Válida por ${DURACION_HORAS} horas.`;
        iniciarContador(restante, "Tu key es válida por:");
        return;
      }
    }

    if (!document.referrer.includes(REFERRER_VALIDO)) {
      loader.style.display = "none";
      sub.textContent = "Para generar tu key de 8 horas, primero debes completar el acortador.";
      status.textContent = "";
      goShortenerBtn.style.display = "block";
      return;
    }

    try {
      let key, existe = true, intentos = 0;
      while (existe) {
        intentos++;
        if (intentos > 15) throw new Error("No se pudo generar una key única, intentá de nuevo");
        key = generarKey();
        const check = await dbGet(`KEYS/${key}`);
        existe = check !== null;
      }

      const expira = ahora + DURACION_HORAS * 3600 * 1000;
      await dbSet(`KEYS/${key}`, { expira: expira });
      await dbSet(`COOLDOWNS/${ip}`, { timestamp: ahora, key: key });

      loader.style.display = "none";
      sub.textContent = "¡Key generada con éxito!";
      const box = document.getElementById("keyBox");
      box.textContent = key;
      box.style.display = "block";
      document.getElementById("copyBtn").style.display = "block";
      status.textContent = `Válida por ${DURACION_HORAS} horas.`;

    } catch (err) {
      loader.style.display = "none";
      sub.textContent = "Ocurrió un error.";
      status.textContent = "Tocá para reintentar.";
      debug.textContent = err.message;
      backBtn.style.display = "block";
      console.error(err);
    }
  }

  function copiarKey() {
    const key = document.getElementById("keyBox").textContent;
    copiarTexto(key, document.getElementById("status"), "¡Copiada!");
  }

  // ===================== COPIADO ROBUSTO (con fallback) =====================

  async function copiarTexto(texto, elementoStatus, mensajeExito) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(texto);
        elementoStatus.textContent = mensajeExito;
        return;
      }
      throw new Error("Clipboard API no disponible");
    } catch (err) {
      try {
        const textarea = document.createElement("textarea");
        textarea.value = texto;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(textarea);
        elementoStatus.textContent = ok ? mensajeExito : "No se pudo copiar, copiá manualmente.";
      } catch (err2) {
        elementoStatus.textContent = "No se pudo copiar, copiá manualmente.";
        console.error(err2);
      }
    }
  }

  iniciar();
</script>

</body>
</html>
