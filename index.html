<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Key Sistem</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Segoe UI', sans-serif;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(circle at 20% 20%, #2d0a4e, #0a0512 70%);
    color: #fff;
    position: relative;
  }
  body::before, body::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 0;
  }
  body::before { background: #7b2ff7; top: -100px; left: -100px; opacity: 0.4; }
  body::after { background: #b721ff; bottom: -120px; right: -100px; opacity: 0.35; }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(30, 10, 50, 0.55);
    border: 1px solid rgba(183, 33, 255, 0.35);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 400px;
    width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    text-align: center;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 60px rgba(183, 33, 255, 0.25);
  }
  h1 {
    font-size: 21px;
    background: linear-gradient(90deg, #b721ff, #7b2ff7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  h2 {
    font-size: 16px;
    color: #fff;
    margin-bottom: 14px;
  }
  p.sub { color: #c8b8e0; font-size: 14px; margin-bottom: 20px; }
  .key-box {
    background: rgba(0,0,0,0.35);
    border: 1px dashed #b721ff;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    word-break: break-all;
    margin-bottom: 14px;
    display: none;
    box-shadow: 0 0 20px rgba(183,33,255,0.2) inset;
  }
  .timer-box {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(183, 33, 255, 0.3);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    display: none;
  }
  .timer-box .label { font-size: 12px; color: #a894c4; margin-bottom: 6px; }
  .timer-box .clock {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #b721ff, #7b2ff7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  button, a.btn2 {
    display: block;
    background: linear-gradient(90deg, #7b2ff7, #b721ff);
    color: #fff;
    border: none;
    text-decoration: none;
    padding: 13px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 0 20px rgba(183, 33, 255, 0.4);
    margin-top: 8px;
  }
  button:disabled { background: #3a2d4a; box-shadow: none; cursor: not-allowed; }
  .status { font-size: 13px; color: #c8b8e0; margin-top: 12px; min-height: 18px; }
  .debug { font-size: 10px; color: #6a5a85; margin-top: 8px; word-break: break-all; }
  .loader {
    border: 3px solid rgba(183,33,255,0.2);
    border-top: 3px solid #b721ff;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    animation: spin 0.8s linear infinite;
    margin: 18px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { margin-top: 16px; font-size: 11px; color: #6a5a85; }
</style>
</head>
<body>

<div class="card">

  <!-- ===================== PANTALLA PRINCIPAL ===================== -->
  <div id="mainScreen">
    <h1>🔮 DM Key Sistem</h1>
    <p class="sub" id="subText">Verificando acceso...</p>

    <div id="loader" class="loader"></div>

    <div id="timerBox" class="timer-box">
      <div class="label" id="timerLabel">Tu key es válida por:</div>
      <div id="clock" class="clock">00:00:00</div>
    </div>

    <div id="keyBox" class="key-box"></div>
    <button id="copyBtn" style="display:none;" onclick="copiarKey()">Copiar key</button>
    <a id="goShortenerBtn8" class="btn2" style="display:none;" href="https://blacklink.site/l.php?u=u95608603eb" onclick="marcarPendiente('8')">⚡ Generar Key de 8h</a>
    <a id="goShortenerBtn12" class="btn2" style="display:none;" href="https://blacklink.site/l.php?u=u94d980f76e" onclick="marcarPendiente('12')">⚡ Generar Key de 12h</a>
    <a id="backBtn" class="btn2" style="display:none;" href="https://darkmatter-oficial.github.io/DarkMatter-Shop/">Volver</a>

    <div id="status" class="status"></div>
    <div id="debug" class="debug"></div>
    <div class="footer">DarkMatter © 2026</div>
  </div>

</div>

<script>
  // ===================== NOTA DE SEGURIDAD IMPORTANTE =====================
  // Este sistema es 100% cliente (HTML/JS) y llama directamente a la REST API
  // de Firebase. Si el nodo /KEYS o /COOLDOWNS de tu Realtime Database permite
  // lectura/escritura pública sin reglas, cualquier persona puede crear/borrar
  // keys directamente contra la API de Firebase, sin pasar por esta página.
  // Configurá las Firebase Security Rules (por ejemplo, exigiendo autenticación
  // de Firebase Auth o validando la forma de los datos) desde la consola de
  // Firebase para cerrar ese hueco.
  //
  // ===================== NOTA SOBRE LA LÓGICA DE 2 ACORTADORES =====================
  // blacklink.site es un único dominio, así que document.referrer va a decir
  // "blacklink.site" sin importar cuál de los 2 links (8h o 12h) haya
  // completado la persona. Para saber CUÁL de los dos completó, este archivo
  // guarda en localStorage, justo antes de mandar a la persona al acortador,
  // qué tipo de key pidió ("8" o "12") junto con la hora en que lo pidió
  // (marcarPendiente). Al volver a la página, si el referrer es blacklink.site
  // Y existe ese "pendiente" y todavía no venció su ventana de validez
  // (PENDING_VALIDEZ_MS), recién ahí se genera la key de ESE tipo. Si no hay
  // pendiente válido (por ejemplo la persona entró directo, o su pendiente ya
  // expiró), NO se genera ninguna key y NO se le dice "ya tenés una key": se
  // le muestran de nuevo los 2 botones para que elija. Esto evita el bug de
  // caer en la pantalla de "ya tenés una key" sin haber completado nada: esa
  // pantalla SOLO aparece si existe un cooldown real y vigente guardado en
  // Firebase (o sea, una key que YA fue generada con éxito antes), nunca por
  // el solo hecho de volver desde blacklink.site.
  //
  // Mientras haya una key activa (de 8h o de 12h) para tu IP, no se puede
  // generar la otra: el cooldown en Firebase guarda cuántas horas dura esa
  // key concreta (cooldown.horas) y hasta que no se cumplan esas horas no se
  // muestran de nuevo los botones de generar.
  const DB_URL = "https://darkmatter-68e65-default-rtdb.firebaseio.com";

  const REFERRER_VALIDO = "blacklink.site";

  const TIPOS_KEY = {
    "8":  { horas: 8,  link: "https://blacklink.site/l.php?u=u95608603eb", boton: "goShortenerBtn8" },
    "12": { horas: 12, link: "https://blacklink.site/l.php?u=u94d980f76e", boton: "goShortenerBtn12" }
  };

  const PENDING_KEY = "dm_pending_tipo";
  const PENDING_VALIDEZ_MS = 30 * 60 * 1000; // 30 minutos para completar el acortador después de tocar el botón

  function marcarPendiente(tipo) {
    try {
      localStorage.setItem(PENDING_KEY, JSON.stringify({ tipo: tipo, ts: Date.now() }));
    } catch (err) {
      console.error(err);
    }
  }

  function leerPendiente() {
    try {
      const raw = localStorage.getItem(PENDING_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || !data.tipo || !data.ts) return null;
      if (!TIPOS_KEY[data.tipo]) return null;
      if (Date.now() - data.ts > PENDING_VALIDEZ_MS) return null;
      return data;
    } catch (err) {
      return null;
    }
  }

  function limpiarPendiente() {
    try {
      localStorage.removeItem(PENDING_KEY);
    } catch (err) {
      console.error(err);
    }
  }

  function generarKey() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    function rand(n) {
      let s = "";
      for (let i = 0; i < n; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
      return s;
    }
    return `ADS-${rand(4)}DM${rand(4)}`;
  }

  async function obtenerIP() {
    const res = await fetch("https://api.ipify.org?format=json");
    if (!res.ok) throw new Error("No se pudo obtener la IP");
    const data = await res.json();
    return data.ip.replace(/\./g, "_");
  }

  async function dbGet(path) {
    const res = await fetch(`${DB_URL}/${path}.json`);
    const data = await res.json();
    if (!res.ok || (data && data.error)) {
      throw new Error("Firebase: " + (data && data.error ? data.error : res.status));
    }
    return data;
  }
  async function dbSet(path, value) {
    const res = await fetch(`${DB_URL}/${path}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(value)
    });
    const data = await res.json();
    if (!res.ok || (data && data.error)) {
      throw new Error("Firebase: " + (data && data.error ? data.error : res.status));
    }
    return data;
  }

  function iniciarContador(msRestante, etiqueta) {
    const timerBox = document.getElementById("timerBox");
    const clock = document.getElementById("clock");
    const timerLabel = document.getElementById("timerLabel");
    const backBtn = document.getElementById("backBtn");
    timerBox.style.display = "block";
    backBtn.style.display = "block";
    if (etiqueta) timerLabel.textContent = etiqueta;

    let restante = msRestante;
    function tick() {
      if (restante <= 0) {
        clock.textContent = "00:00:00";
        document.getElementById("status").textContent = "¡Ya podés generar otra key!";
        return;
      }
      const h = Math.floor(restante / 3600000);
      const m = Math.floor((restante % 3600000) / 60000);
      const s = Math.floor((restante % 60000) / 1000);
      clock.textContent = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      restante -= 1000;
      setTimeout(tick, 1000);
    }
    tick();
  }

  function ocultarBotonesAcortador() {
    document.getElementById("goShortenerBtn8").style.display = "none";
    document.getElementById("goShortenerBtn12").style.display = "none";
  }

  function mostrarBotonesAcortador() {
    document.getElementById("goShortenerBtn8").style.display = "block";
    document.getElementById("goShortenerBtn12").style.display = "block";
  }

  function mostrarKeyGenerada(key, horas) {
    const box = document.getElementById("keyBox");
    box.textContent = key;
    box.style.display = "block";
    document.getElementById("copyBtn").style.display = "block";
    document.getElementById("status").textContent = `Válida por ${horas} horas.`;
  }

  async function iniciar() {
    const status = document.getElementById("status");
    const sub = document.getElementById("subText");
    const loader = document.getElementById("loader");
    const backBtn = document.getElementById("backBtn");
    const debug = document.getElementById("debug");

    let ip, ahora, cooldown;

    // Primero se revisa si ya existe una key activa (de 8h o de 12h) para
    // esta IP. Esto es lo único que puede mostrar la pantalla de "ya tenés
    // una key": nunca se muestra ese mensaje solo por volver desde
    // blacklink.site sin haber generado una key antes.
    try {
      ip = await obtenerIP();
      ahora = Date.now();
      cooldown = await dbGet(`COOLDOWNS/${ip}`);
    } catch (err) {
      loader.style.display = "none";
      sub.textContent = "Ocurrió un error.";
      status.textContent = "Tocá para reintentar.";
      debug.textContent = err.message;
      backBtn.style.display = "block";
      console.error(err);
      return;
    }

    if (cooldown && cooldown.timestamp && cooldown.key && cooldown.horas) {
      const restante = (cooldown.timestamp + cooldown.horas * 3600 * 1000) - ahora;
      if (restante > 0) {
        loader.style.display = "none";
        sub.textContent = `Ya tenés una key de ${cooldown.horas}h activa.`;
        ocultarBotonesAcortador();
        mostrarKeyGenerada(cooldown.key, cooldown.horas);
        iniciarContador(restante, `Tu key de ${cooldown.horas}h es válida por:`);
        return;
      }
    }

    // No hay ninguna key activa todavía. Ahora, y solo ahora, se revisa si
    // la persona viene de blacklink.site Y tiene un pendiente válido (o sea,
    // tocó alguno de los 2 botones hace menos de 30 minutos). Si no se
    // cumplen las dos condiciones, jamás se genera una key sola porque el
    // referrer diga blacklink.site: se le vuelven a mostrar los 2 botones.
    const pendiente = leerPendiente();
    const vieneDeAcortador = document.referrer.includes(REFERRER_VALIDO);

    if (vieneDeAcortador && pendiente) {
      const tipo = TIPOS_KEY[pendiente.tipo];
      try {
        let key, existe = true, intentos = 0;
        while (existe) {
          intentos++;
          if (intentos > 15) throw new Error("No se pudo generar una key única, intentá de nuevo");
          key = generarKey();
          const check = await dbGet(`KEYS/${key}`);
          existe = check !== null;
        }

        const expira = ahora + tipo.horas * 3600 * 1000;
        await dbSet(`KEYS/${key}`, { expira: expira });
        await dbSet(`COOLDOWNS/${ip}`, { timestamp: ahora, key: key, horas: tipo.horas });

        limpiarPendiente();

        loader.style.display = "none";
        sub.textContent = "¡Key generada con éxito!";
        ocultarBotonesAcortador();
        mostrarKeyGenerada(key, tipo.horas);
        return;
      } catch (err) {
        loader.style.display = "none";
        sub.textContent = "Ocurrió un error.";
        status.textContent = "Tocá para reintentar.";
        debug.textContent = err.message;
        backBtn.style.display = "block";
        console.error(err);
        return;
      }
    }

    // Si llegamos acá: no hay key activa, y (no viene del acortador) o (no
    // tiene un pendiente válido). Se limpia cualquier pendiente vencido y se
    // muestran los 2 botones para que elija cuál acortador completar.
    if (pendiente === null) {
      limpiarPendiente();
    }

    loader.style.display = "none";
    sub.textContent = "Elegí qué key querés generar y completá el acortador correspondiente.";
    status.textContent = "";
    mostrarBotonesAcortador();
  }

  function copiarKey() {
    const key = document.getElementById("keyBox").textContent;
    copiarTexto(key, document.getElementById("status"), "¡Copiada!");
  }

  // ===================== COPIADO ROBUSTO (con fallback) =====================

  async function copiarTexto(texto, elementoStatus, mensajeExito) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(texto);
        elementoStatus.textContent = mensajeExito;
        return;
      }
      throw new Error("Clipboard API no disponible");
    } catch (err) {
      try {
        const textarea = document.createElement("textarea");
        textarea.value = texto;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(textarea);
        elementoStatus.textContent = ok ? mensajeExito : "No se pudo copiar, copiá manualmente.";
      } catch (err2) {
        elementoStatus.textContent = "No se pudo copiar, copiá manualmente.";
        console.error(err2);
      }
    }
  }

  iniciar();
</script>

</body>
</html>
